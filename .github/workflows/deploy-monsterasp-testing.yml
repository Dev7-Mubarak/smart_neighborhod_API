name: Build, publish and deploy to MonsterASP.NET
on:
  push:
    branches:
      - develop


jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Setup correct .NET version (your project is net9.0)
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish --runtime win-x86

      # Optional: run tests if you have any test projects
      - name: Test with .NET
        run: dotnet test || echo "No tests found or tests failed, continuing deployment"

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.TESTING_WEBSITE_NAME }}
          server-computer-name: ${{ secrets.TESTING_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.TESTING_SERVER_USERNAME }}
          server-password: ${{ secrets.TESTING_SERVER_PASSWORD }}